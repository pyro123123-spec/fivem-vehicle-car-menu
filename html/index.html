<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Car Menü</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="musicMenu" class="music-menu hidden">
        <div class="menu-container">
            <div class="menu-header">
                <h2>🎵 Musik Menü 🎵</h2>
                <p class="subtitle">Gebe einen YouTube Link ein oder wähle einen gespeicherten</p>
            </div>
            
            <div class="menu-content">
                <div class="input-group">
                    <label for="youtubeLink">YouTube Link:</label>
                    <input type="text" id="youtubeLink" placeholder="https://www.youtube.com/watch?v=...">
                </div>
                
                <div class="saved-music-section">
                    <label>📋 Gespeicherte Links:</label>
                    <div id="savedMusicList" class="saved-music-list">
                        <p style="color: #808080;">Keine gespeicherten Links</p>
                    </div>
                </div>
                
                <div class="button-group">
                    <button id="submitBtn" class="btn btn-success">✓ Bestätigen (Enter)</button>
                    <button id="cancelBtn" class="btn btn-danger">✗ Abbrechen (U)</button>
                </div>
                
                <div id="musicPlayer" class="music-player hidden">
                    <h3>Aktuelle Musik:</h3>
                    <div id="playerInfo" class="player-info"></div>
                    <button id="stopBtn" class="btn btn-warning">⏹ Stoppen</button>
                </div>
            </div>
            
            <div class="menu-footer">
                <p><span class="key">ENTER</span> Bestätigen</p>
                <p><span class="key">U</span> Schließen</p>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
